<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloke Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }
    .panel {
      background: #161b22;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: #238636;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #2ea043; }
    #messages {
      height: 250px;
      overflow-y: auto;
      background: #0d1117;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .msg { margin: 5px 0; background: #21262d; padding: 8px; border-radius: 6px; }
    .msg strong { color: #58a6ff; }
    #admin { display: none; }
    #chat, #invitePanel { display: none; }
  </style>
</head>
<body>

  <!-- ----- REGISTER / LOGIN ----- -->
  <div id="register" class="panel">
    <h2>Register</h2>
    <input type="text" id="displayName" placeholder="Display Name">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <input type="file" id="profilePic" accept="image/*">
    <button id="registerBtn">Register</button>
    <hr>
    <input type="text" id="loginCode" placeholder="Enter 4-digit code to login">
    <button id="loginBtn">Login</button>
  </div>

  <!-- ----- ADMIN PANEL ----- -->
  <div id="admin" class="panel">
    <h2>Admin: Pending Users</h2>
    <div id="pendingUsers"></div>
  </div>

  <!-- ----- CHAT PANEL ----- -->
  <div id="chat" class="panel">
    <h2 id="roomLabel"></h2>
    <div id="messages"></div>
    <input type="text" id="message" placeholder="Type a message...">
    <button id="sendMessage">Send</button>
  </div>

  <!-- ----- INVITE / DM ----- -->
  <div id="invitePanel" class="panel">
    <h3>DM / Invite</h3>
    <input type="text" id="dmCode" placeholder="Enter user 4-digit code to DM">
    <button id="dmBtn">Start DM</button>
    <input type="text" id="inviteCode" placeholder="Enter 4-digit code to Invite">
    <button id="sendInviteBtn">Send Invite</button>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="script.js"></script>
</body>
</html>
