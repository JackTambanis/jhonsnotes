<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloke Chat WebApp</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{background:#f0f2f5;color:#050505;display:flex;height:100vh;overflow:hidden;}
  button,input{font-family:inherit;font-size:1rem;}

  #sidebar{width:280px;background:#242526;display:flex;flex-direction:column;}
  #main{flex:1;display:flex;flex-direction:column;position:relative;}

  #sidebar header{padding:20px;font-size:1.5rem;color:white;text-align:center;border-bottom:1px solid #3a3b3c;}
  #main header{padding:15px;font-weight:bold;background:#3a3b3c;color:white;border-bottom:1px solid #3a3b3c;}

  #searchInput{margin:10px;padding:8px;border-radius:10px;border:none;outline:none;}
  
  #contacts{flex:1;overflow-y:auto;}
  .contact{display:flex;align-items:center;padding:10px;cursor:pointer;border-bottom:1px solid #3a3b3c;}
  .contact:hover{background:#3a3b3c;}
  .contact img{width:40px;height:40px;border-radius:50%;margin-right:10px;}
  .contact span{font-weight:bold;color:white;}
  .contact .code{font-size:0.8rem;color:#aaa;margin-left:auto;}

  #chatWindow{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #messages{flex:1;overflow-y:auto;padding:15px;background:#e5ddd5;}
  .msg{margin-bottom:10px;display:flex;align-items:flex-start;}
  .msg img{width:35px;height:35px;border-radius:50%;margin-right:10px;}
  .msgContent{background:white;padding:8px 12px;border-radius:12px;max-width:70%;position:relative;}
  .msgContent span{display:block;}
  .msgContent .time{font-size:0.7rem;color:#888;text-align:right;margin-top:3px;}
  .msg.ping .msgContent{background:#fff2a8;}

  #inputArea{display:flex;padding:10px;background:#f0f2f5;border-top:1px solid #ccc;}
  #messageInput{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc;margin-right:10px;}
  #sendMessageBtn{padding:10px 15px;border:none;border-radius:20px;background:#0084ff;color:white;cursor:pointer;}
  #sendMessageBtn:hover{background:#006bbd;}

  .panel{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;}
  .panel input{margin:5px 0;padding:10px;width:250px;border-radius:10px;border:none;}
  .panel button{width:150px;margin-top:10px;padding:10px;border-radius:10px;border:none;background:#0084ff;color:white;cursor:pointer;}
  .panel button:hover{background:#006bbd;}
</style>
</head>
<body>

<div id="sidebar">
  <header>Bloke Chat</header>
  <input type="text" id="searchInput" placeholder="Search contacts...">
  <div id="contacts"></div>
</div>

<div id="main">
  <header id="chatHeader">Welcome</header>
  <div id="chatWindow">
    <div id="messages"></div>
    <div id="inputArea">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button id="sendMessageBtn">Send</button>
    </div>
  </div>
</div>

<!-- Panels -->
<div id="registerPanel" class="panel">
  <h2>Register</h2>
  <input id="displayName" placeholder="Display Name">
  <input id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <input type="file" id="profilePic">
  <button id="registerBtn">Register</button>
</div>

<div id="loginPanel" class="panel" style="display:none;">
  <h2>Login</h2>
  <input id="loginCode" placeholder="4-digit code">
  <button id="loginBtn">Login</button>
</div>

<div id="adminPanel" class="panel" style="display:none;">
  <h2>Admin Panel</h2>
  <div id="pendingUsers"></div>
</div>

<div id="invitePanel" class="panel" style="display:none;">
  <h2>Invite / DM</h2>
  <input id="dmCode" placeholder="DM Code">
  <button id="dmBtn">Start DM</button>
  <input id="inviteCode" placeholder="Invite Code">
  <button id="sendInviteBtn">Send Invite</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBG6J5vESmji-k5Z1N1h9Ssya6f1aQGgnE",
  authDomain: "bloke-f55ca.firebaseapp.com",
  databaseURL: "https://bloke-f55ca-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bloke-f55ca",
  storageBucket: "bloke-f55ca.appspot.com",
  messagingSenderId: "480383058927",
  appId: "1:480383058927:web:5c7b6cd56f82536f01ec1a",
  measurementId: "G-XLN2DQ823C"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const registerPanel = document.getElementById("registerPanel");
const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const invitePanel = document.getElementById("invitePanel");

const displayNameInput = document.getElementById('displayName');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const profilePicInput = document.getElementById('profilePic');
const registerBtn = document.getElementById('registerBtn');

const loginCodeInput = document.getElementById('loginCode');
const loginBtn = document.getElementById('loginBtn');

const pendingUsersDiv = document.getElementById('pendingUsers');
const contactsDiv = document.getElementById('contacts');
const chatHeader = document.getElementById('chatHeader');
const messagesDiv = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendMessageBtn = document.getElementById('sendMessageBtn');

const searchInput = document.getElementById('searchInput');

const dmCodeInput = document.getElementById('dmCode');
const dmBtn = document.getElementById('dmBtn');
const inviteCodeInput = document.getElementById('inviteCode');
const sendInviteBtn = document.getElementById('sendInviteBtn');

let currentUser=null;
let currentRoomID=null;
let contacts={};

function generate4DigitCode(){ return Math.floor(1000+Math.random()*9000); }

// Registration
registerBtn.onclick = ()=>{
  const displayName = displayNameInput.value.trim();
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();
  const file = profilePicInput.files[0];
  if(!displayName||!username||!password||!file) return alert("Fill all fields");
  const reader = new FileReader();
  reader.onload = ()=>{
    const base64 = reader.result;
    const usersRef = ref(db,"users");
    onValue(usersRef,(snapshot)=>{
      const users = snapshot.val()||{};
      const isAdmin = Object.keys(users).length===0;
      const newUserRef = push(ref(db,"users"));
      const code4digit = generate4DigitCode();
      set(newUserRef,{
        displayName, username, password, profilePicURL:base64,
        code4digit, approved:isAdmin, isAdmin, lastActive:Date.now()
      });
      alert(`Registered! Your code: ${code4digit}. ${isAdmin?"You are admin":"Waiting for approval"}`);
      registerPanel.style.display="none";
      loginPanel.style.display="block";
    },{onlyOnce:true});
  };
  reader.readAsDataURL(file);
};

// Login
loginBtn.onclick = ()=>{
  const code = loginCodeInput.value.trim();
  if(!code) return alert("Enter code");
  const usersRef = ref(db,"users");
  onValue(usersRef,(snapshot)=>{
    const users = snapshot.val()||{};
    for(let uid in users){
      const u = users[uid];
      if(u.code4digit==code){
        if(!u.approved) return alert("Waiting for approval");
        currentUser = {...u,id:uid};
        alert(`Logged in as ${u.username}`);
        loginPanel.style.display="none";
        showChatUI();
        if(u.isAdmin) loadPendingUsers();
        return;
      }
    }
    alert("Invalid code");
  },{onlyOnce:true});
};

// Admin
function loadPendingUsers(){
  adminPanel.style.display="block";
  pendingUsersDiv.innerHTML="";
  const usersRef = ref(db,"users");
  onValue(usersRef,(snapshot)=>{
    const users = snapshot.val()||{};
    pendingUsersDiv.innerHTML="";
    for(let uid in users){
      const u = users[uid];
      if(!u.approved){
        const div = document.createElement("div");
        div.textContent=`${u.username} (${u.displayName}) `;
        const approveBtn=document.createElement("button");
        approveBtn.textContent="Approve";
        approveBtn.onclick = ()=>update(ref(db,`users/${uid}`),{approved:true});
        div.appendChild(approveBtn);
        pendingUsersDiv.appendChild(div);
      }
    }
  });
}

// Chat UI
function showChatUI(){
  chatHeader.innerText="Select a contact";
  populateContacts();
  messagesDiv.innerHTML="";
  document.getElementById("chatWindow").style.display="flex";
  invitePanel.style.display="block";
}

// Populate contacts with search
function populateContacts(){
  const usersRef = ref(db,"users");
  onValue(usersRef,(snapshot)=>{
    const users = snapshot.val()||{};
    contactsDiv.innerHTML="";
    for(let uid in users){
      const u = users[uid];
      if(u.approved && uid!==currentUser.id){
        const div = document.createElement("div");
        div.className="contact";
        let codeLabel = currentUser.isAdmin ? ` (${u.code4digit})` : "";
        div.innerHTML=`<img src="${u.profilePicURL}"><span>${u.username}</span><span class="code">${codeLabel}</span>`;
        div.onclick = ()=>startChat(uid,u.username,u.profilePicURL);
        contactsDiv.appendChild(div);
      }
    }
  });
}

// Filter contacts
searchInput.addEventListener("input",()=>{
  const filter = searchInput.value.toLowerCase();
  Array.from(contactsDiv.children).forEach(c=>{
    const name = c.querySelector('span').innerText.toLowerCase();
    c.style.display = name.includes(filter)?"flex":"none";
  });
});

// Start chat
function startChat(uid,name,pic){
  currentRoomID = [currentUser.id,uid].sort().join("_");
  chatHeader.innerText=name;
  const messagesRef = ref(db,`rooms/${currentRoomID}/messages`);
  onValue(messagesRef,(snapshot)=>{
    const msgs = snapshot.val()||{};
    messagesDiv.innerHTML="";
    for(let mid in msgs){
      const m = msgs[mid];
      const div = document.createElement("div");
      div.className="msg";
      div.innerHTML=`<img src="${m.profilePicURL}"><div class="msgContent"><span><strong>${m.sender}:</strong> ${m.text}</span><span class="time">${new Date(m.timestamp).toLocaleTimeString()}</span></div>`;
      if(m.ping) div.classList.add("ping");
      messagesDiv.appendChild(div);
      div.scrollIntoView();
    }
  });
}

// Send message
sendMessageBtn.onclick = ()=>{
  const text = messageInput.value.trim();
  if(!text||!currentRoomID) return;
  const messagesRef = push(ref(db,`rooms/${currentRoomID}/messages`));
  set(messagesRef,{
    sender:currentUser.username,
    text,
    profilePicURL:currentUser.profilePicURL,
    ping:text.toLowerCase()==="ping",
    timestamp:Date.now()
  });
  messageInput.value="";
}

// DM
dmBtn.onclick = ()=>{
  const code = dmCodeInput.value.trim();
  if(!code) return alert("Enter code");
  const usersRef = ref(db,"users");
  onValue(usersRef,(snapshot)=>{
    const users = snapshot.val()||{};
    for(let uid in users){
      const u = users[uid];
      if(u.code4digit==code&&u.approved){
        startChat(uid,u.username,u.profilePicURL);
        alert(`DM started with ${u.username}`);
        return;
      }
    }
    alert("User not found or not approved");
  },{onlyOnce:true});
}

// Invite
sendInviteBtn.onclick = ()=>{
  const code = inviteCodeInput.value.trim();
  if(!code) return alert("Enter code");
  const invitesRef = push(ref(db,"invites"));
  set(invitesRef,{fromUser:currentUser.id,toCode:code,roomID:currentRoomID,status:"pending",timestamp:Date.now()});
  alert("Invite sent!");
}

// Active tracking
setInterval(()=>{
  if(currentUser) update(ref(db,`users/${currentUser.id}`),{lastActive:Date.now()});
},5000);
</script>
</body>
</html>
