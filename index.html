<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPS Chat</title>

<!-- Styles -->
<style>
/* ===== Global Reset ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Helvetica Neue',Arial,sans-serif; }
body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#e5ddd5; color:#2f2f2f; transition:0.3s; }
body.dark-mode { background:#18191a; color:#e4e6eb; }

#app { width:100%; max-width:500px; height:95vh; background:#fff; border-radius:10px; box-shadow:0 12px 25px rgba(0,0,0,0.15); display:flex; flex-direction:column; overflow:hidden; transition:0.3s; }
body.dark-mode #app { background:#242526; }

h1 { background:linear-gradient(90deg,#0084ff,#006bbf); color:#fff; text-align:center; font-weight:bold; font-size:1.6rem; padding:15px; letter-spacing:0.5px; }

#auth,#profile,#users,#chat,#groupChat { padding:20px; display:flex; flex-direction:column; gap:15px; background:#fff; animation:fadeIn 0.5s ease forwards; }
body.dark-mode #auth,#profile,#users,#chat,#groupChat { background:#242526; }

input,select,textarea { padding:12px 15px; border-radius:8px; border:1px solid #ccd0d5; font-size:1rem; transition:0.3s; }
body.dark-mode input,body.dark-mode select,body.dark-mode textarea { background:#3a3b3c; border:1px solid #555657; color:#e4e6eb; }
input:focus,textarea:focus,select:focus { outline:none; border-color:#0084ff; box-shadow:0 0 8px rgba(0,132,255,0.4); background:#fffdfd; }

button { padding:12px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; transition:all 0.3s ease; }
#signup,#login,#sendMsg,#updateProfile,#createGroup,#logout,#darkModeBtn { background:#0084ff;color:#fff; }
#signup:hover,#login:hover,#sendMsg:hover,#updateProfile:hover,#createGroup:hover{ background:#006bbf; transform:scale(1.03); }
#logout { background:#f02849;color:#fff; } 
#logout:hover { background:#d0193f; transform:scale(1.03); }
#darkModeBtn { background:#4f4f4f;color:#fff; } 
#darkModeBtn:hover { background:#2c2c2c; transform:scale(1.02); }

#chat,#groupChat { flex:1; display:flex; flex-direction:column; background:#f0f2f5; overflow:hidden; }
body.dark-mode #chat,#groupChat { background:#3a3b3c; }

#messages,#groupMessages { flex:1; padding:15px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; scroll-behavior:smooth; }
#messages::-webkit-scrollbar,#groupMessages::-webkit-scrollbar{ width:8px; }
#messages::-webkit-scrollbar-thumb,#groupMessages::-webkit-scrollbar-thumb{ background:#ccd0d5; border-radius:4px; }
body.dark-mode #messages::-webkit-scrollbar-thumb,body.dark-mode #groupMessages::-webkit-scrollbar-thumb { background:#555657; }

#messages div,#groupMessages div { max-width:75%; padding:14px 18px; border-radius:20px; background:#e4e6eb; word-wrap:break-word; font-size:0.95rem; position:relative; opacity:0; animation:slideUp 0.5s forwards; }
#messages div.user-msg,#groupMessages div.user-msg { background:linear-gradient(135deg,#0084ff,#006bbf); color:#fff; margin-left:auto; box-shadow:0 2px 8px rgba(0,0,0,0.12); }

#messages div:hover::after,#groupMessages div:hover::after { content:'👍 ❤️ 😂 😮 😢 😡'; font-size:1rem; position:absolute; top:-20px; right:0; background:#fff; border-radius:20px; padding:2px 6px; box-shadow:0 2px 8px rgba(0,0,0,0.1); cursor:pointer; }
body.dark-mode #messages div:hover::after,body.dark-mode #groupMessages div:hover::after{ background:#3a3b3c; }

#messages div::after,#groupMessages div::after{ content:attr(data-time); font-size:0.7rem; color:#7a7a7a; position:absolute; bottom:-16px; right:10px; }

#messages div::before,#groupMessages div::before{ content:''; width:32px; height:32px; border-radius:50%; background:#b0b3b8; display:inline-block; margin-right:10px; vertical-align:middle; }

#typing,#groupTyping{ font-size:0.85rem; color:#7a7a7a; padding-left:12px; margin-bottom:5px; font-style:italic; }

#input-container,#groupInputContainer{ display:flex; padding:12px 15px; background:#fff; border-top:1px solid #ccd0d5; gap:10px; box-shadow:0 -2px 5px rgba(0,0,0,0.08); }
body.dark-mode #input-container,body.dark-mode #groupInputContainer { background:#242526; }

#msgInput,#groupMsgInput{ flex:1; border-radius:20px; border:1px solid #ccd0d5; font-size:1rem; outline:none; }
#sendMsg,#sendGroupMsg{ width:80px; border-radius:20px; background:linear-gradient(90deg,#0084ff,#006bbf); color:#fff; font-weight:bold; border:none; cursor:pointer; transition:0.2s ease; }
#sendMsg:hover,#sendGroupMsg:hover{ transform:scale(1.05); box-shadow:0 4px 12px rgba(0,132,255,0.3); }

@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes slideUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

@media(max-width:480px){ #app{width:95%;height:95vh;} #msgInput,#groupMsgInput{font-size:0.9rem;padding:10px 12px;} #sendMsg,#sendGroupMsg{width:70px;font-size:0.9rem;padding:10px;} #messages div,#groupMessages div{font-size:0.9rem;padding:10px 14px;} }
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

</head>
<body>

<div id="app">
  <h1>BPS Chat</h1>

  <!-- Auth -->
  <div id="auth">
    <input type="text" id="displayName" placeholder="Display Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="signup">Sign Up</button>
    <button id="login">Log In</button>
    <button id="darkModeBtn">Toggle Dark Mode</button>
  </div>

  <!-- Profile -->
  <div id="profile" style="display:none;">
    <input type="text" id="bio" placeholder="Bio">
    <input type="url" id="avatarURL" placeholder="Avatar URL">
    <button id="updateProfile">Update Profile</button>
    <button id="goToUsers">Find Users</button>
  </div>

  <!-- Users -->
  <div id="users" style="display:none;">
    <input type="text" id="searchUser" placeholder="Search users...">
    <div id="userList"></div>
  </div>

  <!-- Chat -->
  <div id="chat" style="display:none;">
    <div id="typing"></div>
    <div id="messages"></div>
    <div id="input-container">
      <input type="text" id="msgInput" placeholder="Type a message">
      <button id="sendMsg">Send</button>
    </div>
    <button id="logout">Log Out</button>
  </div>

  <!-- Group Chat -->
  <div id="groupChat" style="display:none;">
    <input type="text" id="groupName" placeholder="Group Name">
    <button id="createGroup">Create Group</button>
    <div id="groupList"></div>
    <div id="groupTyping"></div>
    <div id="groupMessages"></div>
    <div id="groupInputContainer">
      <input type="text" id="groupMsgInput" placeholder="Type a group message">
      <button id="sendGroupMsg">Send</button>
    </div>
  </div>
</div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBG6J5vESmji-k5Z1N1h9Ssya6f1aQGgnE",
  authDomain: "bloke-f55ca.firebaseapp.com",
  databaseURL: "https://bloke-f55ca-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bloke-f55ca",
  storageBucket: "bloke-f55ca.firebasestorage.app",
  messagingSenderId: "480383058927",
  appId: "1:480383058927:web:5c7b6cd56f82536f01ec1a"
};

// Init Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Elements
const authDiv = document.getElementById('auth');
const profileDiv = document.getElementById('profile');
const usersDiv = document.getElementById('users');
const chatDiv = document.getElementById('chat');
const groupChatDiv = document.getElementById('groupChat');

const signupBtn = document.getElementById('signup');
const loginBtn = document.getElementById('login');
const logoutBtn = document.getElementById('logout');
const darkModeBtn = document.getElementById('darkModeBtn');
const displayNameInput = document.getElementById('displayName');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const bioInput = document.getElementById('bio');
const avatarInput = document.getElementById('avatarURL');
const updateProfileBtn = document.getElementById('updateProfile');
const goToUsersBtn = document.getElementById('goToUsers');
const searchUserInput = document.getElementById('searchUser');
const userListDiv = document.getElementById('userList');

const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendMsg');
const messagesDiv = document.getElementById('messages');
const typingDiv = document.getElementById('typing');

const groupNameInput = document.getElementById('groupName');
const createGroupBtn = document.getElementById('createGroup');
const groupListDiv = document.getElementById('groupList');
const groupMsgInput = document.getElementById('groupMsgInput');
const sendGroupBtn = document.getElementById('sendGroupMsg');
const groupMessagesDiv = document.getElementById('groupMessages');
const groupTypingDiv = document.getElementById('groupTyping');

// Dark Mode
darkModeBtn.addEventListener('click',()=>document.body.classList.toggle('dark-mode'));

// Sign Up
signupBtn.addEventListener('click',()=>{
  auth.createUserWithEmailAndPassword(emailInput.value,passwordInput.value)
    .then(res=>{
      const uid=res.user.uid;
      db.ref('users/'+uid).set({displayName:displayNameInput.value,email:emailInput.value,bio:'',avatar:'',uid});
      alert("Signed Up! Now update profile");
      authDiv.style.display='none';
      profileDiv.style.display='flex';
    })
    .catch(err=>alert(err.message));
});

// Log In
loginBtn.addEventListener('click',()=>{
  auth.signInWithEmailAndPassword(emailInput.value,passwordInput.value)
    .then(res=>{
      authDiv.style.display='none';
      profileDiv.style.display='flex';
      loadProfile();
    })
    .catch(err=>alert(err.message));
});

// Log Out
logoutBtn.addEventListener('click',()=>{
  auth.signOut().then(()=>{
    authDiv.style.display='flex';
    profileDiv.style.display='none';
    usersDiv.style.display='none';
    chatDiv.style.display='none';
    groupChatDiv.style.display='none';
    messagesDiv.innerHTML='';
    groupMessagesDiv.innerHTML='';
  });
});

// Update Profile
updateProfileBtn.addEventListener('click',()=>{
  const uid=auth.currentUser.uid;
  db.ref('users/'+uid).update({bio:bioInput.value,avatar:avatarInput.value});
  alert('Profile Updated!');
});

// Load Profile
function loadProfile(){
  const uid=auth.currentUser.uid;
  db.ref('users/'+uid).once('value').then(snap=>{
    const data=snap.val();
    displayNameInput.value=data.displayName;
    bioInput.value=data.bio||'';
    avatarInput.value=data.avatar||'';
  });
}

// Search Users
goToUsersBtn.addEventListener('click',()=>{
  profileDiv.style.display='none';
  usersDiv.style.display='flex';
  loadUsers();
});

function loadUsers(){
  db.ref('users').on('value',snap=>{
    userListDiv.innerHTML='';
    const users=snap.val();
    for(let uid in users){
      if(uid!==auth.currentUser.uid){
        const div=document.createElement('div');
        div.textContent=users[uid].displayName;
        div.style.cursor='pointer';
        div.addEventListener('click',()=>startDM(uid,users[uid].displayName));
        userListDiv.appendChild(div);
      }
    }
  });
}

// Start Direct Message
function startDM(uid,displayName){
  usersDiv.style.display='none';
  chatDiv.style.display='flex';
  messagesDiv.innerHTML='';
  const chatId=[auth.currentUser.uid,uid].sort().join('_');
  db.ref('messages/'+chatId).on('value',snap=>{
    messagesDiv.innerHTML='';
    const msgs=snap.val();
    for(let key in msgs){
      const msg=msgs[key];
      const div=document.createElement('div');
      div.textContent=msg.text;
      div.setAttribute('data-time',new Date(msg.timestamp).toLocaleTimeString());
      if(msg.uid===auth.currentUser.uid) div.classList.add('user-msg');
      messagesDiv.appendChild(div);
    }
    messagesDiv.scrollTop=messagesDiv.scrollHeight;
  });

  sendBtn.onclick=()=>sendDM(chatId);
  msgInput.onkeypress=(e)=>{if(e.key==='Enter') sendDM(chatId);}
}

function sendDM(chatId){
  const text=msgInput.value.trim();
  if(!text) return;
  db.ref('messages/'+chatId).push({text,uid:auth.currentUser.uid,timestamp:Date.now()});
  msgInput.value='';
}

// TODO: Implement group chat, reactions, typing indicators, etc.

</script>

</body>
</html>
