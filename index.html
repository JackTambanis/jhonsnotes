<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloke Chat</title>
<link rel="stylesheet" href="style.css">
<style>
  body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:20px;min-height:100vh;}
  .panel{background:#161b22;padding:20px;border-radius:12px;width:90%;max-width:400px;box-shadow:0 0 20px rgba(255,255,255,0.1);margin-bottom:20px;}
  input[type=text], input[type=password], input[type=file]{width:100%;padding:10px;margin:6px 0;border:none;border-radius:8px;box-sizing:border-box;background:#0d1117;color:#e6edf3;border:1px solid #30363d;}
  input::placeholder{color:#8b949e;}
  button{width:100%;padding:10px;margin-top:6px;background:#238636;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:background 0.2s ease;}
  button:hover{background:#2ea043;}
  #messages{height:250px;overflow-y:auto;background:#0d1117;padding:10px;border-radius:8px;margin-bottom:10px;border:1px solid #30363d;}
  .msg{margin:5px 0;background:#21262d;padding:8px;border-radius:6px;word-wrap:break-word;display:flex;align-items:center;}
  .msg img{width:30px;height:30px;border-radius:50%;margin-right:8px;}
  .msg strong{color:#58a6ff;}
  #admin,#chat,#invitePanel{display:none;}
  .ping{background-color:#fffa8d !important;color:#0d1117;font-weight:bold;}
</style>
</head>
<body>

<!-- Registration -->
<div id="register" class="panel">
  <h2>Register</h2>
  <input id="displayName" placeholder="Display Name">
  <input id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <input type="file" id="profilePic">
  <button id="registerBtn">Register</button>
</div>

<!-- Login -->
<div id="login" class="panel">
  <h2>Login</h2>
  <input id="loginCode" placeholder="Enter 4-digit code">
  <button id="loginBtn">Login</button>
</div>

<!-- Admin Panel -->
<div id="admin" class="panel">
  <h2>Admin Panel</h2>
  <div id="pendingUsers"></div>
</div>

<!-- Chat -->
<div id="chat" class="panel">
  <h2 id="roomLabel"></h2>
  <div id="messages"></div>
  <input id="message" placeholder="Type a message...">
  <button id="sendMessage">Send</button>
</div>

<!-- DM & Invite -->
<div id="invitePanel" class="panel">
  <h3>Direct Message</h3>
  <input id="dmCode" placeholder="Enter user's code">
  <button id="dmBtn">Start DM</button>
  <h3>Invite User</h3>
  <input id="inviteCode" placeholder="Enter user's code">
  <button id="sendInviteBtn">Send Invite</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBG6J5vESmji-k5Z1N1h9Ssya6f1aQGgnE",
  authDomain: "bloke-f55ca.firebaseapp.com",
  databaseURL: "https://bloke-f55ca-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bloke-f55ca",
  storageBucket: "bloke-f55ca.appspot.com",
  messagingSenderId: "480383058927",
  appId: "1:480383058927:web:5c7b6cd56f82536f01ec1a",
  measurementId: "G-XLN2DQ823C"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const displayNameInput = document.getElementById('displayName');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const profilePicInput = document.getElementById('profilePic');
const registerBtn = document.getElementById('registerBtn');

const loginCodeInput = document.getElementById('loginCode');
const loginBtn = document.getElementById('loginBtn');

const adminDiv = document.getElementById('admin');
const pendingUsersDiv = document.getElementById('pendingUsers');

const chatDiv = document.getElementById('chat');
const roomLabel = document.getElementById('roomLabel');
const messagesDiv = document.getElementById('messages');
const messageInput = document.getElementById('message');
const sendMessageBtn = document.getElementById('sendMessage');

const invitePanel = document.getElementById('invitePanel');
const dmCodeInput = document.getElementById('dmCode');
const dmBtn = document.getElementById('dmBtn');
const inviteCodeInput = document.getElementById('inviteCode');
const sendInviteBtn = document.getElementById('sendInviteBtn');

let currentUser=null;
let currentRoomID=null;

function generate4DigitCode(){ return Math.floor(1000+Math.random()*9000); }

// ---------- Registration ----------
registerBtn.onclick = () => {
  const displayName = displayNameInput.value.trim();
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();
  const file = profilePicInput.files[0];
  if(!displayName||!username||!password||!file) return alert("Fill all fields and select a profile picture");
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result;
    const code4digit = generate4DigitCode();
    const usersRef = ref(db,"users");
    onValue(usersRef,snapshot=>{
      const users = snapshot.val()||{};
      let isAdmin = Object.keys(users).length===0; // first user admin
      const newUserRef = push(ref(db,"users"));
      set(newUserRef,{
        displayName,
        username,
        password,
        profilePicURL:base64,
        code4digit,
        approved:isAdmin,
        isAdmin,
        lastActive:Date.now()
      });
      alert(`Registered! 4-digit code: ${code4digit}. ${isAdmin?"You are admin and auto-approved.":"Waiting for admin approval."}`);
    }, {onlyOnce:true});
  };
  reader.readAsDataURL(file);
};

// ---------- Login ----------
loginBtn.onclick = ()=>{
  const code = loginCodeInput.value.trim();
  if(!code) return alert("Enter 4-digit code");
  const usersRef = ref(db,"users");
  onValue(usersRef,(snapshot)=>{
    const users = snapshot.val()||{};
    for(let userID in users){
      const user = users[userID];
      if(user.code4digit==code){
        if(!user.approved) return alert("Waiting for admin approval");
        currentUser = {id:userID,...user};
        alert(`Logged in as ${user.username}`);
        loginCodeInput.value="";
        showChatUI();
        trackActiveUser();
        if(user.isAdmin) loadPendingUsers();
        return;
      }
    }
    alert("Invalid code");
  },{onlyOnce:true});
};

// ---------- Admin Panel ----------
function loadPendingUsers(){
  adminDiv.style.display="block";
  pendingUsersDiv.innerHTML="";
  const usersRef = ref(db,"users");
  onValue(usersRef,(snapshot)=>{
    const users = snapshot.val()||{};
    pendingUsersDiv.innerHTML="";
    for(let userID in users){
      const user = users[userID];
      if(!user.approved){
        const div=document.createElement('div');
        div.textContent=`${user.username} (${user.displayName}) `;
        const approveBtn=document.createElement('button');
        approveBtn.textContent="Approve";
        approveBtn.onclick=()=>update(ref(db,`users/${userID}`),{approved:true});
        div.appendChild(approveBtn);
        pendingUsersDiv.appendChild(div);
      }
    }
  });
}

// ---------- Chat ----------
function showChatUI(){ 
  document.getElementById('register').style.display="none"; 
  document.getElementById('login').style.display="none"; 
  chatDiv.style.display="block"; 
  invitePanel.style.display="block"; 
}

function joinDM(targetCode){
  const usersRef = ref(db,"users");
  onValue(usersRef,(snapshot)=>{
    const users = snapshot.val()||{};
    let targetID=null,targetName="";
    for(let userID in users){
      const user = users[userID];
      if(user.code4digit==targetCode&&user.approved){targetID=userID;targetName=user.username;break;}
    }
    if(!targetID) return alert("User not found or not approved");
    const roomID = [currentUser.id,targetID].sort().join("_");
    const roomRef = ref(db,`rooms/${roomID}`);
    set(roomRef,{members:[currentUser.id,targetID]},{merge:true});
    currentRoomID = roomID;
    listenToRoom(roomID);
    roomLabel.innerText = `DM: ${targetName}`;
    alert(`DM ready with ${targetName}`);
  },{onlyOnce:true});
}

function listenToRoom(roomID){
  const messagesRef = ref(db,`rooms/${roomID}/messages`);
  onValue(messagesRef,(snapshot)=>{
    const messages = snapshot.val()||{};
    messagesDiv.innerHTML="";
    for(let msgID in messages){
      const msg = messages[msgID];
      const div=document.createElement('div');
      div.className="msg";
      div.innerHTML=`<img src="${msg.profilePicURL || ''}"><strong>${msg.sender}:</strong> ${msg.text}`;
      if(msg.ping) div.classList.add("ping");
      messagesDiv.appendChild(div);
      div.scrollIntoView();
    }
  });
}

sendMessageBtn.onclick = ()=>{
  const text=messageInput.value.trim();
  if(!text||!currentRoomID) return;
  const messageRef = push(ref(db,`rooms/${currentRoomID}/messages`));
  set(messageRef,{
    sender:currentUser.username,
    text,
    profilePicURL:currentUser.profilePicURL,
    ping:text.toLowerCase()==="ping",
    timestamp:Date.now()
  });
  messageInput.value="";
}

dmBtn.onclick=()=>{
  const code=dmCodeInput.value.trim();
  if(!code) return alert("Enter a code");
  joinDM(code);
  dmCodeInput.value="";
}

// ---------- Invite ----------
sendInviteBtn.onclick=()=>{
  const code=inviteCodeInput.value.trim();
  if(!code) return alert("Enter a code");
  const invitesRef = push(ref(db,"invites"));
  set(invitesRef,{
    fromUser:currentUser.id,
    toCode:code,
    roomID:currentRoomID,
    status:"pending",
    timestamp:Date.now()
  });
  inviteCodeInput.value="";
  alert("Invite sent!");
}

const invitesRef = ref(db,"invites");
onValue(invitesRef,(snapshot)=>{
  const invites = snapshot.val()||{};
  for(let inviteID in invites){
    const invite = invites[inviteID];
    if(currentUser && invite.toCode==currentUser.code4digit && invite.status==="pending"){
      alert(`You received an invite from user ID: ${invite.fromUser}`);
    }
  }
});

// ---------- Active User Tracking ----------
function trackActiveUser(){
  setInterval(()=>{
    if(currentUser) update(ref(db,`users/${currentUser.id}`),{lastActive:Date.now()});
  },5000);
}

</script>
</body>
</html>
