<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger Clone</title>

<!-- Styles -->
<style>
/* ====== Global Reset ====== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Helvetica Neue', Arial, sans-serif;
}

/* ====== Body ====== */
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #e5ddd5;
  color: #2f2f2f;
  transition: background 0.3s ease;
}

/* ====== App Container ====== */
#app {
  width: 100%;
  max-width: 420px;
  height: 90vh;
  background-color: #fff;
  border-radius: 10px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: all 0.3s ease;
}

/* ====== Header ====== */
#app h1 {
  background: linear-gradient(90deg, #0084ff, #006bbf);
  color: #fff;
  text-align: center;
  font-weight: bold;
  font-size: 1.5rem;
  padding: 15px;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1);
  letter-spacing: 0.5px;
}

/* ====== Auth Section ====== */
#auth {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  background-color: #fff;
  animation: fadeIn 0.5s ease forwards;
}

/* ====== Input Fields ====== */
#auth input, #msgInput {
  padding: 12px 15px;
  border-radius: 8px;
  border: 1px solid #ccd0d5;
  font-size: 1rem;
  transition: border-color 0.3s, box-shadow 0.3s;
}
#auth input:focus, #msgInput:focus {
  outline: none;
  border-color: #0084ff;
  box-shadow: 0 0 8px rgba(0,132,255,0.4);
  background-color: #fffdfd;
}

/* ====== Buttons ====== */
#auth button, #sendMsg, #logout, #darkModeBtn {
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}
#auth button, #sendMsg {
  background-color: #0084ff;
  color: #fff;
}
#auth button:hover, #sendMsg:hover {
  background-color: #006bbf;
  transform: scale(1.03);
}
#logout {
  background-color: #f02849;
  color: #fff;
}
#logout:hover {
  background-color: #d0193f;
  transform: scale(1.03);
}
#darkModeBtn {
  background-color: #4f4f4f;
  color: #fff;
}
#darkModeBtn:hover {
  background-color: #2c2c2c;
  transform: scale(1.02);
}

/* ====== Chat Section ====== */
#chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  background-color: #f0f2f5;
  overflow: hidden;
  animation: fadeIn 0.6s ease forwards;
}

/* ====== Messages Container ====== */
#messages {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  scroll-behavior: smooth;
}

/* ====== Individual Message Bubble ====== */
#messages div {
  max-width: 75%;
  padding: 14px 18px;
  border-radius: 20px;
  background-color: #e4e6eb;
  word-wrap: break-word;
  font-size: 0.95rem;
  position: relative;
  transition: all 0.3s ease, transform 0.2s ease;
  opacity: 0;
  animation: slideUp 0.5s forwards;
}

/* ====== User Message Bubble ====== */
#messages div.user-msg {
  background-color: #0084ff;
  color: #fff;
  margin-left: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

/* ====== Bubble Hover ====== */
#messages div:hover {
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  transform: translateY(-2px);
}

/* ====== Input Container ====== */
#input-container {
  display: flex;
  padding: 12px 15px;
  background-color: #fff;
  border-top: 1px solid #ccd0d5;
  gap: 10px;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.08);
}

/* ====== Message Input Field ====== */
#msgInput {
  flex: 1;
  border-radius: 20px;
  border: 1px solid #ccd0d5;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
}

/* ====== Send Button ====== */
#sendMsg {
  width: 80px;
  background: linear-gradient(90deg, #0084ff, #006bbf);
  color: #fff;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
}
#sendMsg:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(0,132,255,0.3);
}

/* ====== Scrollbar Styling ====== */
#messages::-webkit-scrollbar {
  width: 8px;
}
#messages::-webkit-scrollbar-thumb {
  background-color: #ccd0d5;
  border-radius: 4px;
}

/* ====== Avatar Placeholder ====== */
#messages div::before {
  content: '';
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background-color: #b0b3b8;
  display: inline-block;
  margin-right: 10px;
  vertical-align: middle;
}

/* ====== Timestamps ====== */
#messages div::after {
  content: attr(data-time);
  font-size: 0.7rem;
  color: #7a7a7a;
  position: absolute;
  bottom: -16px;
  right: 10px;
}

/* ====== Reactions Bubble ====== */
#messages div:hover::after {
  content: '👍 ❤️ 😂 😮 😢 😡';
  font-size: 1rem;
  position: absolute;
  top: -20px;
  right: 0;
  background: #fff;
  border-radius: 20px;
  padding: 2px 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* ====== Typing Indicator ====== */
#typing {
  font-size: 0.85rem;
  color: #7a7a7a;
  padding-left: 12px;
  margin-bottom: 5px;
  font-style: italic;
}

/* ====== Animation Keyframes ====== */
@keyframes fadeIn { from {opacity: 0} to {opacity:1} }
@keyframes slideUp { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform:translateY(0);} }

/* ====== Responsive Adjustments ====== */
@media(max-width:480px){
  #app { width: 95%; height: 95vh; }
  #msgInput { font-size: 0.9rem; padding: 10px 12px; }
  #sendMsg { width: 70px; font-size: 0.9rem; padding: 10px; }
  #messages div { font-size: 0.9rem; padding: 10px 14px; }
}

/* ====== Dark Mode Option ====== */
body.dark-mode {
  background-color: #18191a;
  color: #e4e6eb;
}
body.dark-mode #app { background-color: #242526; }
body.dark-mode #auth input, body.dark-mode #msgInput {
  background-color: #3a3b3c; border: 1px solid #555657; color: #e4e6eb;
}
body.dark-mode #messages div { background-color: #3a3b3c; color: #e4e6eb; }
body.dark-mode #messages div.user-msg { background-color: #0084ff; color: #fff; }
body.dark-mode #input-container { background-color: #242526; }

/* ====== Shadow Depth ====== */
#messages div, #auth button, #sendMsg, #logout {
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}

/* ====== Optional Gradients on Messages ====== */
#messages div.user-msg {
  background: linear-gradient(135deg, #0084ff, #006bbf);
}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

</head>
<body>

<div id="app">
  <h1>Messenger Clone</h1>

  <!-- Auth Section -->
  <div id="auth">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="signup">Sign Up</button>
    <button id="login">Log In</button>
    <button id="darkModeBtn">Toggle Dark Mode</button>
  </div>

  <!-- Chat Section -->
  <div id="chat" style="display:none;">
    <div id="typing"></div>
    <div id="messages"></div>
    <div id="input-container">
      <input type="text" id="msgInput" placeholder="Type a message">
      <button id="sendMsg">Send</button>
    </div>
    <button id="logout">Log Out</button>
  </div>
</div>

<!-- Script -->
<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBG6J5vESmji-k5Z1N1h9Ssya6f1aQGgnE",
  authDomain: "bloke-f55ca.firebaseapp.com",
  databaseURL: "https://bloke-f55ca-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bloke-f55ca",
  storageBucket: "bloke-f55ca.firebasestorage.app",
  messagingSenderId: "480383058927",
  appId: "1:480383058927:web:5c7b6cd56f82536f01ec1a"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Elements
const signupBtn = document.getElementById('signup');
const loginBtn = document.getElementById('login');
const logoutBtn = document.getElementById('logout');
const darkModeBtn = document.getElementById('darkModeBtn');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const authDiv = document.getElementById('auth');
const chatDiv = document.getElementById('chat');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendMsg');
const messagesDiv = document.getElementById('messages');
const typingDiv = document.getElementById('typing');

// ====== Dark Mode Toggle ======
darkModeBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
});

// ====== Sign Up ======
signupBtn.addEventListener('click', () => {
  auth.createUserWithEmailAndPassword(emailInput.value, passwordInput.value)
    .then(() => alert("Signed Up!"))
    .catch(err => alert(err.message));
});

// ====== Log In ======
loginBtn.addEventListener('click', () => {
  auth.signInWithEmailAndPassword(emailInput.value, passwordInput.value)
    .then(() => {
      authDiv.style.display = 'none';
      chatDiv.style.display = 'flex';
      loadMessages();
    })
    .catch(err => alert(err.message));
});

// ====== Log Out ======
logoutBtn.addEventListener('click', () => {
  auth.signOut().then(() => {
    chatDiv.style.display = 'none';
    authDiv.style.display = 'flex';
    messagesDiv.innerHTML = '';
  });
});

// ====== Send Message ======
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') sendMessage();
});

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  const uid = auth.currentUser.uid;
  const timestamp = Date.now();
  db.ref('messages').push({text, uid, timestamp});
  msgInput.value = '';
}

// ====== Load Messages ======
function loadMessages() {
  db.ref('messages').orderByChild('timestamp').on('value', snapshot => {
    messagesDiv.innerHTML = '';
    snapshot.forEach(child => {
      const msg = child.val();
      const div = document.createElement('div');
      div.textContent = msg.text;
      div.setAttribute('data-time', new Date(msg.timestamp).toLocaleTimeString());
      if (msg.uid === auth.currentUser.uid) div.classList.add('user-msg');
      messagesDiv.appendChild(div);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

// ====== Typing Indicator (Simulated) ======
msgInput.addEventListener('input', () => {
  if (msgInput.value.trim()) {
    typingDiv.textContent = 'You are typing...';
  } else {
    typingDiv.textContent = '';
  }
});
</script>

</body>
</html>
