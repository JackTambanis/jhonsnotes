<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloke Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #login, #chat {
      background: #161b22;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #2ea043;
    }
    #messages {
      height: 300px;
      overflow-y: auto;
      background: #0d1117;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .msg {
      margin: 5px 0;
      background: #21262d;
      padding: 8px;
      border-radius: 6px;
    }
    .msg strong {
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div id="login">
    <h2>Join Chat</h2>
    <input id="username" placeholder="Enter username" />
    <input id="room" placeholder="Enter room code" />
    <button onclick="joinChat()">Join</button>
  </div>

  <div id="chat" style="display:none;">
    <h2 id="roomLabel"></h2>
    <div id="messages"></div>
    <input id="message" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBG6J5vESmji-k5Z1N1h9Ssya6f1aQGgnE",
      authDomain: "bloke-f55ca.firebaseapp.com",
      databaseURL: "https://bloke-f55ca-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bloke-f55ca",
      storageBucket: "bloke-f55ca.firebasestorage.app",
      messagingSenderId: "480383058927",
      appId: "1:480383058927:web:5c7b6cd56f82536f01ec1a",
      measurementId: "G-XLN2DQ823C"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let username = "";
    let room = "";

    window.joinChat = function() {
      username = document.getElementById("username").value.trim();
      room = document.getElementById("room").value.trim();
      if (!username || !room) return alert("Enter both username and room code!");

      document.getElementById("login").style.display = "none";
      document.getElementById("chat").style.display = "block";
      document.getElementById("roomLabel").innerText = "Room: " + room;

      const messagesRef = ref(db, "rooms/" + room);
      onChildAdded(messagesRef, (snapshot) => {
        const msg = snapshot.val();
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `<strong>${msg.user}:</strong> ${msg.text}`;
        document.getElementById("messages").appendChild(div);
        div.scrollIntoView();
      });
    };

    window.sendMessage = function() {
      const text = document.getElementById("message").value.trim();
      if (!text) return;
      const messagesRef = ref(db, "rooms/" + room);
      push(messagesRef, { user: username, text });
      document.getElementById("message").value = "";
    };
  </script>
</body>
</html>
